[workspace]
members = ["crates/contracts", "crates/connector", "crates/client", "crates/cli"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"
repository = "https://github.com/raysofspace/enumeray-cli"
homepage = "https://enumeray.com"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
enumeray-client = { path = "crates/client" }
enumeray-connector = { path = "crates/connector" }
enumeray-contracts = { path = "crates/contracts" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
jsonschema = { version = "0.56.0", default-features = false, features = ["arbitrary-precision"] }
# Avoid the RustCrypto RSA dependency affected by RUSTSEC-2023-0071.
percent-encoding = "2"
reqwest = { version = "0.13.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11"
tempfile = { version = "3", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
tokio = { version = "1.53.3" }
tower = { version = "0.5", features = ["util"] }
unicode-normalization = "0.1.25"
url = "2"
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
