name: Public client verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: native (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            profile: full
          - runner: ubuntu-24.04-arm
            profile: native-platform
          - runner: macos-15
            profile: native-platform
          - runner: macos-15-intel
            profile: native-platform
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Process/socket fixtures need bounded contention on smaller native hosts.
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          # Keep runner images, CPUs and selected feature sets independent.
          key: ${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.profile }}
          cache-on-failure: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: scripts/verify.sh validate
      - name: Verify ${{ matrix.profile }}
        run: scripts/verify.sh "${{ matrix.profile }}"
