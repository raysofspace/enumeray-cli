name: Enumeray executable

# Private service push-tag runs sign separate prepare and publish authorizations.
# Dispatch uses the trusted default-branch workflow, not the selected source ref.
on:
  repository_dispatch:
    types: [qualified-release, qualified-publication]

permissions:
  contents: read

concurrency:
  # This unverified value only partitions the queue; authorization remains signed.
  # GitHub retains one pending run per group even with cancellation disabled.
  group: binary-release-delivery-${{ fromJSON(github.event.client_payload.receipt).version }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      tag: ${{ steps.identity.outputs.tag }}
      purpose: ${{ steps.identity.outputs.purpose }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Authenticate the exact private service authorization
        id: identity
        env:
          QUALIFIED_REQUEST: ${{ toJSON(github.event.client_payload) }}
          PURPOSE: ${{ github.event.action == 'qualified-publication' && 'publish' || 'prepare' }}
        run: python3 scripts/release_delivery.py authorize --purpose "$PURPOSE" --output "$RUNNER_TEMP/authorization"
      - name: Reconcile a completed preparation without rebuilding
        id: ready
        if: steps.identity.outputs.purpose == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_delivery.py ready --identity "$RUNNER_TEMP/authorization/identity.json" --directory "$RUNNER_TEMP/existing"

  build:
    needs: authorize
    if: needs.authorize.outputs.purpose == 'prepare' && needs.authorize.outputs.ready != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '["ubuntu-24.04"]'
            image_variable: ENUMERAY_MANYLINUX_2_28_X86_64_IMAGE
          - target: aarch64-unknown-linux-gnu
            runner: '["ubuntu-24.04-arm"]'
            image_variable: ENUMERAY_MANYLINUX_2_28_AARCH64_IMAGE
          - target: x86_64-apple-darwin
            runner: '["macos-15-intel"]'
          - target: aarch64-apple-darwin
            runner: '["macos-15"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      PUBLIC_REVISION: ${{ needs.authorize.outputs.revision }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Check out only the authorized public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        if: runner.os == 'macOS'
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build and qualify on actual macOS 15
        if: runner.os == 'macOS'
        run: bash tools/scripts/build-release-native.sh --source "$GITHUB_WORKSPACE/source" --target "$TARGET" --revision "$PUBLIC_REVISION" --output "$RUNNER_TEMP/release-out"
      - name: Build and qualify natively on glibc 2.28
        if: runner.os == 'Linux'
        env:
          MANYLINUX_IMAGE: ${{ vars[matrix.image_variable] }}
        run: |
          # Check the runner and Docker host before any possibly emulated image.
          native_docker_arch="$(docker info --format '{{.Architecture}}')"
          case "$TARGET:$RUNNER_ARCH:$(uname -m):$native_docker_arch" in
            x86_64-unknown-linux-gnu:X64:x86_64:x86_64|x86_64-unknown-linux-gnu:X64:x86_64:amd64) ;;
            aarch64-unknown-linux-gnu:ARM64:aarch64:aarch64|aarch64-unknown-linux-gnu:ARM64:aarch64:arm64|aarch64-unknown-linux-gnu:ARM64:arm64:aarch64|aarch64-unknown-linux-gnu:ARM64:arm64:arm64) ;;
            *) echo 'Release qualification requires a native runner and Docker host for the target CPU' >&2; exit 1 ;;
          esac
          # Provision a reviewed manylinux 2.28 image digest for each native CPU.
          expected_image=manylinux_2_28_x86_64
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then expected_image=manylinux_2_28_aarch64; fi
          case "$MANYLINUX_IMAGE" in
            quay.io/pypa/"$expected_image"@sha256:*) ;;
            *) echo "Configure the pinned $expected_image image in repository variables" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/release-out"
          docker run --rm --entrypoint /bin/bash \
            -e TARGET -e PUBLIC_REVISION -e CARGO_PROFILE_RELEASE_STRIP -e CARGO_INCREMENTAL \
            -v "$GITHUB_WORKSPACE/tools:/work/tools:ro" \
            -v "$GITHUB_WORKSPACE/source:/work/source" \
            -v "$RUNNER_TEMP/release-out:/out" -w /work/source \
            "$MANYLINUX_IMAGE" -euo pipefail -c '
              export PATH="/opt/python/cp312-cp312/bin:/root/.cargo/bin:$PATH"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
              bash /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.98.1
              git config --global --add safe.directory /work/source
              bash /work/tools/scripts/build-release-native.sh --source /work/source --target "$TARGET" --revision "$PUBLIC_REVISION" --output /out
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/release-out/*
          if-no-files-found: error
          retention-days: 7

  source:
    needs: authorize
    if: needs.authorize.outputs.purpose == 'prepare' && needs.authorize.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - name: Package the exact public source and redistribution notices
        env:
          PUBLIC_REVISION: ${{ needs.authorize.outputs.revision }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: python3 tools/scripts/package-source.py --source "$GITHUB_WORKSPACE/source" --revision "$PUBLIC_REVISION" --version "${RELEASE_TAG#v}" --output "$RUNNER_TEMP/source-out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-source
          path: ${{ runner.temp }}/source-out/*
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [authorize, build, source]
    if: needs.authorize.outputs.purpose == 'prepare' && needs.authorize.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out trusted tooling; candidate code is never executed here
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Authenticate preparation evidence again before signing
        env:
          QUALIFIED_REQUEST: ${{ toJSON(github.event.client_payload) }}
        run: python3 scripts/release_delivery.py authorize --purpose prepare --output "$RUNNER_TEMP/authorization"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Sign and stage a complete immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_delivery.py stage --identity "$RUNNER_TEMP/authorization/identity.json" --evidence "$RUNNER_TEMP/authorization" --artifacts "$RUNNER_TEMP/candidate" --workflow-revision "$GITHUB_SHA"

  publish:
    needs: authorize
    if: needs.authorize.outputs.purpose == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out trusted publication tooling; never rebuild candidates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the private artifact acceptance authorization
        env:
          QUALIFIED_REQUEST: ${{ toJSON(github.event.client_payload) }}
        run: python3 scripts/release_delivery.py authorize --purpose publish --output "$RUNNER_TEMP/authorization"
      - name: Publish only the already qualified manifest and archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_delivery.py publish --identity "$RUNNER_TEMP/authorization/identity.json" --evidence "$RUNNER_TEMP/authorization" --directory "$RUNNER_TEMP/release"

  channels:
    needs: [authorize, publish]
    if: needs.authorize.outputs.purpose == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: homebrew
            token_secret: ENUMERAY_HOMEBREW_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the published artifact set before channel delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_delivery.py fetch --published --tag '${{ needs.authorize.outputs.tag }}' --directory "$RUNNER_TEMP/release"
      - name: Generate channel metadata from that exact manifest
        run: python3 scripts/generate-channels.py --manifest "$RUNNER_TEMP/release/release-manifest.json" --output "$RUNNER_TEMP/channel" --channel '${{ matrix.channel }}'
      - name: Submit or reconcile this channel independently
        env:
          GH_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: python3 scripts/publish-channels.py --delivery "$RUNNER_TEMP/channel" --config distribution/channels.json --channel '${{ matrix.channel }}' --submit --status "$RUNNER_TEMP/channel-status.json"
      - name: Report per-channel delivery state
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/channel-status.json" ]; then
            cat "$RUNNER_TEMP/channel-status.json" >> "$GITHUB_STEP_SUMMARY"
          fi
