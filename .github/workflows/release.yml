name: Enumeray executable

# Only the service release workflow dispatches after qualifying its pinned client
# revision and activating the persistent baseline. The token is scoped to this
# public repository; no private service source or build artifact is checked out.
on:
  repository_dispatch:
    types: [qualified-release]

permissions:
  contents: read

concurrency:
  group: binary-release-delivery
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Check out the trusted public release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install integrity-checked signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Authenticate the private matching-service qualification receipt
        id: identity
        env:
          QUALIFIED_REQUEST: ${{ toJSON(github.event.client_payload) }}
        run: python3 scripts/verify-service-qualification.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.identity.outputs.revision }}
          persist-credentials: false
      - name: Verify source version and immutable release identity
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != 'binaries-v' + version:
              raise SystemExit('Qualified version differs from public source version')
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$PUBLIC_REVISION"
          else
            gh release create "$RELEASE_TAG" --target "$PUBLIC_REVISION" --draft --title "$RELEASE_TAG" --notes "Unified CLI, connector and compute-runner packages. Matching-service qualification authorized this exact public source revision. Each platform archive requires its native package checks."
          fi

  build:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Test independent clients
        run: scripts/verify.sh native-clients
      - name: Build and qualify public executable archives
        run: |
          cargo build --locked --release --target "$TARGET" -p enumeray-cli --bin enumeray
          python3 scripts/package-binaries.py --target "$TARGET" --version "${RELEASE_TAG#binaries-v}"
          python3 scripts/qualify-binary-archives.py --archives dist --target "$TARGET"
      - name: Install integrity-checked signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign checksums using the public workflow identity
        run: |
          for checksum in dist/*.sha256; do
            cosign sign-blob --yes --bundle "$checksum.sigstore.json" "$checksum"
          done
      - name: Attach immutable archives and signatures to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*
