[package]
name = "enumeray-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Retain the connector's existing digest implementation during structural refactors.
sha2 = "0.10"
base64 = { workspace = true }
getrandom = { workspace = true }
enumeray-contracts = { workspace = true }
enumeray-client = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
time = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time", "macros", "process", "io-util"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio"] }
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
